<html>

  <head>
    <title> LOGIN PAGE </title>
  </head>

  <body>
    <h2>GOD BLESS AMERICA</h2>
    <p>Roster: Lucas Ou, Leon Wong</p>

    <h1>
      Howdy, friends!
    </h1>


    <h3>
      Enter your username below to proceed.
    </h3>
    <form action="/auth" method="GET"> <!-- You can specify the HTML request method with the method attribute of the form tag -->
      <input type="text" name="username">
      <input type="submit" name="sub1" value="go GET!"> <!-- The value attribute of the input tag changes the submit button's text -->
      <input type="submit" name="sub2" formmethod="POST" value="go POST!"> <!-- The formmethod attribute of the input tag overrides the form's method -->
    </form>
    <br>
  </body>

</html>
